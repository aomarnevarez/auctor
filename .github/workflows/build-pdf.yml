name: Build PDF
on:
  push:
    paths:
      - "**.tex"
      - ".github/workflows/build-pdf.yml"
  workflow_dispatch:
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: book-pdf
          path: main.pdf
